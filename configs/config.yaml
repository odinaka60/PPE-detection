model:
  path: "models/best.pt"
  person_path: "models/yolov8n.pt"
  confidence_threshold: 0.45
  person_confidence: 0.30
  min_person_height: 0.25 
  iou_threshold: 0.50
  device: "cpu"

agent:
  provider: "ollama"                                        
  model: "gpt-5-nano"
  embeddings_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  vectorstore_dir: "data/vectorstore"
  regulations_dir: "data/regulations"
  top_k: 4

camera:
  source: "tests/videos/construction_worker.mp4"

ppe:
  required_classes: [Hardhat, Gloves, Goggles, "Safety Vest"]     
  min_containment: 0.5       

violation:
  confirm_after: 3           
  clear_after: 2             
  forget_after: 15     

runtime:
  infer_every: 5

audit:
  output_dir: "logs/"
  camera_id: "CAM-ZONE-A"