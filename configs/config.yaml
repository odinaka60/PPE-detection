model:
  path: "models/best.onnx"
  confidence_threshold: 0.45
  iou_threshold: 0.50
  device: "cpu"

camera:
  source: "tests/videos/construction_worker.mp4"

ppe:
  required_classes: [Hardhat, Gloves, Goggles, "Safety Vest"]
  person_class: Person      
  min_containment: 0.5       

violation:
  confirm_after: 3           
  clear_after: 2             
  forget_after: 15     

runtime:
  infer_every: 5

audit:
  output_dir: "logs/"
  camera_id: "CAM-ZONE-A"