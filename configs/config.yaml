model:
  path: "models/best.pt"
  person_path: "yolov8n.pt"
  confidence_threshold: 0.45
  person_confidence: 0.30
  min_person_height: 0.25 
  iou_threshold: 0.50
  device: "cpu"

camera:
  source: "tests/videos/construction_worker.mp4"

ppe:
  required_classes: [Hardhat, Gloves, Goggles, "Safety Vest"]     
  min_containment: 0.5       

violation:
  confirm_after: 3           
  clear_after: 2             
  forget_after: 15     

runtime:
  infer_every: 5

audit:
  output_dir: "logs/"
  camera_id: "CAM-ZONE-A"